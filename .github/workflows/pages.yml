name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Assemble site (allowlist only)
        if: github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons fonts _site/
          rm -f _site/icons/club-logo-source.png
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s/const VERSION = 'dev';/const VERSION = '${SHORT_SHA}';/" _site/sw.js _site/js/version.js
          grep -q "${SHORT_SHA}" _site/sw.js
          grep -q "${SHORT_SHA}" _site/js/version.js

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
